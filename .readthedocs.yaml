version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.12"

  jobs:
    post_checkout:
      # setuptools_scm needs tags + full history to derive the version
      - git fetch --tags --unshallow || git fetch --tags
    post_create_environment:
      # Install uv
      - pip install uv
    post_install:
      # Install FABulous plus the 'docs' dependency group from the root project,
      # resolved from uv.lock so the built docs match a tested dependency set.
      # UV_PROJECT_ENVIRONMENT points uv at the environment Read the Docs
      # already created instead of letting it make its own .venv.
      # See https://github.com/readthedocs/readthedocs.org/pull/11152/
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --locked --no-default-groups --group docs

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

formats:
  - pdf
  - epub
