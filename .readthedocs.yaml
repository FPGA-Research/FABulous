version: 2

build:
  os: "ubuntu-24.04"
  tools:
    # Keep in step with docs/.python-version, which pins every other entry point.
    python: "3.12"

  jobs:
    post_checkout:
      # setuptools_scm needs tags + full history to derive the version
      - git fetch --tags --unshallow || git fetch --tags
    post_create_environment:
      # Install uv
      - pip install uv
    post_install:
      # Install from docs/uv.lock. Resolving fresh here would build a different
      # environment from the one `task docs-build` and Dependabot test, and a
      # Sphinx extension release could then break the build with nothing in the
      # repository having changed.
      # VIRTUAL_ENV needs to be set manually for now.
      # See https://github.com/readthedocs/readthedocs.org/pull/11152/
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH uv sync --directory docs --locked --active --no-dev

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

formats:
  - pdf
  - epub
