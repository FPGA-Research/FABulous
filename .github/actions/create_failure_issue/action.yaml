name: Create failure issue
description: Create a GitHub issue on CI failure with deduplication

inputs:
  title:
    description: "Issue title (used for deduplication)"
    required: true
  body:
    description: "Issue body in markdown"
    required: true
  labels:
    description: "Comma-separated labels (first label used for dedup search)"
    required: true
  github_token:
    description: "GitHub token for API access"
    required: true

runs:
  using: "composite"
  steps:
    - name: Create issue on failure
      uses: actions/github-script@v9
      env:
        ISSUE_TITLE: ${{ inputs.title }}
        ISSUE_BODY: ${{ inputs.body }}
        ISSUE_LABELS: ${{ inputs.labels }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const title = process.env.ISSUE_TITLE;
          const body = process.env.ISSUE_BODY;
          const labels = process.env.ISSUE_LABELS.split(',').map(l => l.trim());
          const searchLabel = labels[0];

          // Titles carry no date, so a repeat failure matches the still-open issue
          // and is recorded as a comment on it rather than a new issue.
          const openIssues = await github.paginate(github.rest.issues.listForRepo, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: searchLabel,
            per_page: 100
          });
          const existing = openIssues.find(i => !i.pull_request && i.title === title);

          if (existing) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: body
            });
            console.log(`Issue #${existing.number} still open, added a comment: ${title}`);
          } else {
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: labels
            });
            console.log(`Created issue #${created.data.number}: ${title}`);
          }
