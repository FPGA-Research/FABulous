version: 2

multi-ecosystem-groups:
  eda-toolchain:
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

updates:
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    # Our pyproject.toml constraints are deliberately loose lower bounds. Only
    # refresh the resolved versions in uv.lock; never rewrite the manifests.
    versioning-strategy: "lockfile-only"
    multi-ecosystem-group: "eda-toolchain"
    patterns:
      - "librelane"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"

  - package-ecosystem: "nix"
    directory: "/"
    multi-ecosystem-group: "eda-toolchain"
    patterns:
      - "*"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/**/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Pin the Ubuntu base image to an LTS release manually. Dependabot cannot
    # distinguish LTS (even-year .04) from interim releases, and break the build.
    ignore:
      - dependency-name: "ubuntu"
