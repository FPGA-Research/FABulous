name: Run pre-commit hooks

# Driven by ci.yml.
on:
  workflow_call:

# Pinned, else this inherits ci.yml's ceiling (the union of all its callees).
permissions:
  contents: read

jobs:
  pre-commit:
    # Self-hosted; its uv and pre-commit caches are refilled nightly from main.
    runs-on: [self-hosted, book2]
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install the project
      run: |
        echo "UV_SYSTEM_PYTHON=1" >> $GITHUB_ENV
        uv sync --locked

    - name: run pre-commit
      run: |
        uv run pre-commit install
        SKIP=no-commit-to-branch uv run pre-commit run --show-diff-on-failure --color=always --all-files
