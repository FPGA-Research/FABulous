name: Build the documentation

# Driven by ci.yml.
on:
  workflow_call:

# Pinned, else this inherits ci.yml's ceiling (the union of all its callees).
permissions:
  contents: read

jobs:
  docs:
    # Self-hosted; its uv cache is refilled nightly from main.
    runs-on: [self-hosted, book2]
    steps:
      # setuptools_scm reads tags to derive the version shown in the sidebar.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Read the Docs builds on 3.12; .readthedocs.yaml carries the same pin.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # Read the Docs installs the docs group from uv.lock and builds with
      # fail_on_warning, so this is the same environment and the same -W as the
      # published site.
      - name: Build the HTML documentation
        run: uv run --locked task docs-build
